        :root {
            --primary: #990000; /* الأحمر القاني */
            --primary-hover: #B30000;

        body {

            background: rgba(255, 255, 255, 0.05);

        .glass-input:focus {

            background: rgba(255, 255, 255, 0.09);

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), #660000);

        #toastContainer {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px 24px; border-radius: 12px; color: #fff;
            font-weight: 600; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #scannerVideo { width: 100%; max-height: 320px; object-fit: cover; border-radius: 16px; }

        /* Library error banner */
        #libErrorBanner {

        #libErrorBanner a { color: #ffd; text-decoration: underline; }
    </style>

    <div id="toastContainer"></div>

    <script>
        /* ========= Robust loader for QR library (improved) =========
           What changed:
           - Tries local files in ./libs first (multiple candidate names).
           - Tries UMD CDNs by injecting <script> with timeout & onerror.
           - Tries ESM CDN via dynamic import() as a fallback.
           - Shows persistent banner with Retry / Download / Docs when all fail.
           - Returns a resolved lib object (window.QRCode || window.qrcode || module default).
        */

        let lastQrLibLoadError = null;

        function isQrLibReady() {
            const lib = window.QRCode || window.qrcode;
            if (lib) {
                // many bundles expose toCanvas or toDataURL
                if (typeof lib.toCanvas === 'function' || typeof lib.toDataURL === 'function') return lib;
                // some expose default export under .default
                if (lib.default && (typeof lib.default.toCanvas === 'function' || typeof lib.default.toDataURL === 'function')) return lib.default;
            }
            return null;
        }

        function showLibErrorBanner(title, msg, downloadUrl) {
            const banner = document.getElementById('libErrorBanner');
            if (!banner) return;
            document.getElementById('libErrorTitle').textContent = title || 'تعذر تحميل مكتبة إنشاء الرموز';
            document.getElementById('libErrorMsg').textContent = msg || 'الرجاء المحاولة مرة أخرى أو تنزيل الملف يدوياً.';
            const dlBtn = document.getElementById('libDownloadBtn');
            dlBtn.href = downloadUrl || 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
            document.getElementById('libRetryBtn').onclick = () => {
                banner.style.display = 'none';
                ensureQRCodeLoaded(true).catch(() => {});
            };
            document.getElementById('libDocsBtn').onclick = () => {
                alert('انسخ ملف qrcode.min.js إلى مجلد /libs ضمن نفس مسار الصفحة (./libs/qrcode.min.js). يمكنك تنزيله من: https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js');
            };
            banner.style.display = 'flex';
        }

        function loadScriptWithTimeout(src, timeout = 7000) {
            return new Promise((resolve, reject) => {
                // avoid injecting same script twice
                for (const s of document.scripts) {
                    if (s.src && (s.src === src || s.src.endsWith(src) || s.src.includes(src))) {
                        // wait a short moment to let onload handlers run if pending
                        setTimeout(() => {
                            const ok = isQrLibReady();
                            ok ? resolve(ok) : reject(new Error('Script present but library not ready: ' + src));
                        }, 150);
                        return;
                    }
                }

                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.crossOrigin = 'anonymous';
                let done = false;
                const to = setTimeout(() => {
                    if (done) return;
                    done = true;
                    script.onerror = script.onload = null;
                    script.remove();
                    reject(new Error('Timeout loading script: ' + src));
                }, timeout);

                script.onload = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(to);
                    const ready = isQrLibReady();
                    if (ready) resolve(ready);
                    else {
                        // sometimes UMD sets window.qrcode after tiny delay
                        setTimeout(() => {
                            const r2 = isQrLibReady();
                            r2 ? resolve(r2) : reject(new Error('Loaded but lib not exposing API: ' + src));
                        }, 80);
                    }
                };
                script.onerror = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(to);
                    script.remove();
                    reject(new Error('Failed to load script: ' + src));
                };
                document.head.appendChild(script);
            });
        }

        async function tryImportEsm(url, timeout = 7000) {
            // dynamic import with timeout
            return new Promise((resolve, reject) => {
                let timedOut = false;
                const to = setTimeout(() => {
                    timedOut = true;
                    reject(new Error('ESM import timeout: ' + url));
                }, timeout);

                import(url).then(mod => {
                    if (timedOut) return;
                    clearTimeout(to);
                    // some ESM builds export default, some attach to window
                    const lib = mod && (mod.default || mod);
                    if (lib && (typeof lib.toCanvas === 'function' || typeof lib.toDataURL === 'function')) {
                        resolve(lib);
                    } else {
                        // sometimes ESM also sets window.qrcode
                        const ready = isQrLibReady();
                        if (ready) resolve(ready);
                        else resolve(lib); // may be undefined but caller handles
                    }
                }).catch(err => {
                    clearTimeout(to);
                    reject(err);
                });
            });
        }

        function ensureQRCodeLoaded(forceRetry = false) {
            // forceRetry: when true, bypass early cached check and try again (used by Retry button)
            return new Promise(async (resolve, reject) => {
                try {
                    const readyNow = isQrLibReady();
                    if (readyNow && !forceRetry) return resolve(readyNow);

                    // candidates (local first)
                    const localCandidates = [
                        './libs/qrcode.min.js',
                        './libs/qrcode.umd.min.js',
                        './libs/qrcode.js',
                        '/libs/qrcode.min.js',
                        '/libs/qrcode.js'
                    ];

                    const cdnUmd = [
                        'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js',
                        'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js'
                    ];

                    const cdnEsm = [
                        'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.esm.min.js',
                        'https://unpkg.com/qrcode@1.5.3/build/qrcode.esm.min.js'
                    ];

                    // helper to iterate with graceful failure
                    const tryList = async (list, loaderFn) => {
                        for (const url of list) {
                            try {
                                const lib = await loaderFn(url);
                                const ready = lib || isQrLibReady();
                                if (ready && (typeof ready.toCanvas === 'function' || typeof ready.toDataURL === 'function')) {
                                    return ready;
                                }
                            } catch (e) {
                                // console.warn('candidate failed', url, e);
                            }
                        }
                        return null;
                    };

                    // 1) local files
                    const local = await tryList(localCandidates, (u) => loadScriptWithTimeout(u, 4500));
                    if (local) return resolve(local);

                    // 2) CDN UMD
                    const umd = await tryList(cdnUmd, (u) => loadScriptWithTimeout(u, 5000));
                    if (umd) return resolve(umd);

                    // 3) Try ESM dynamic import (some environments prefer ESM)
                    const esm = await tryList(cdnEsm, (u) => tryImportEsm(u, 6000));
                    if (esm) return resolve(esm);

                    lastQrLibLoadError = new Error('تعذر تحميل مكتبة QR من جميع المصادر المحلية والبعيدة.');
                    showLibErrorBanner(
                        'تعذر تحميل مكتبة QR',
                        'جرّب الضغط على "إعادة المحاولة" أو انقل الملف qrcode.min.js إلى ./libs (المسار المحلي).',
                        cdnUmd[0]
                    );

                    return reject(lastQrLibLoadError);
                } catch (err) {
                    lastQrLibLoadError = err;
                    showLibErrorBanner(
                        'خطأ أثناء تحميل المكتبة',
                        (err && err.message) ? err.message : 'حدث خطأ غير متوقع أثناء تحميل مكتبة QR.',
                        'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js'
                    );
                    return reject(err);
                }
            });
        }

        /* ================== Remaining app code (kept same behavior) ================== */
        let currentDataType = 'vcard';
        let qrCodeInstance = null;
        let activeScannerStream = null;

        window.onload = function () {
            setTimeout(() => {
                const loader = document.getElementById("loaderScreen");
                if (loader && loader.style.display !== "none") {
                    loader.style.display = "none";
                }
            }, 1200);

            // Ensure QR lib loaded (local ./libs preferred) then render QR
            ensureQRCodeLoaded()
                .then(() => { updateQRCode(); })
                .catch((err) => {
                    showToast(err.message || 'تعذر تحميل مكتبة QR Code', 'error');
                    console.error('QR loader error:', err);
                    // reflect failure in UI
                    document.getElementById('rawDataPreview') && (document.getElementById('rawDataPreview').innerText = 'تعذر تحميل مكتبة إنشاء الرموز. راجع الشريط العلوي لإعادة المحاولة أو لتنزيل الملف.');
                });

            // wire up retry/download buttons visibility (already set by showLibErrorBanner)
        };

        /* ... The rest of original JS functions (generateRawDataPayload, updateQRCode, drawCenterIconOnCanvas, etc.)
           should be preserved from your original source. For clarity I will include the critical ones that interact
           with ensureQRCodeLoaded below, and otherwise the rest of functions remain unchanged. */

        function generateRawDataPayload() {
            // (same implementation as your original; omitted here for brevity)
            // In your integration, keep the original vcard/url/wifi/email/text/social/phone handling.
            // For the demo file I'm returning a placeholder.
            return "مثال: لاختبار تحميل المكتبة";
        }

        function updateCardDisplay() { /* keep your original implementation */ }

        function updateQRCode() {
            const rawData = generateRawDataPayload();
            const rawPreview = document.getElementById('rawDataPreview');
            if (rawPreview) rawPreview.innerText = rawData;

            // quick guard: ensure library loaded before attempting to render
            const canvasParent = document.getElementById('qrCodeContainer');
            if (!canvasParent) return;
            canvasParent.innerHTML = '<canvas id="qrCanvas"></canvas>';
            const canvas = document.getElementById('qrCanvas');

            // detect if lib ready
            const readyLib = isQrLibReady();
            if (!readyLib) {
                // request load (non-blocking)
                ensureQRCodeLoaded().then(lib => {
                    try {
                        const opts = { width: 200, margin: 2, color: { dark: '#000', light: '#fff' }, errorCorrectionLevel: 'M' };
                        if (lib && typeof lib.toCanvas === 'function') {
                            lib.toCanvas(canvas, rawData, opts, (err) => {
                                if (err) showToast('خطأ أثناء إنشاء الرمز: ' + (err.message || err), 'error');
                            });
                        } else if (lib && typeof lib.toDataURL === 'function') {
                            const data = lib.toDataURL(rawData, opts);
                            const img = new Image();
                            img.onload = () => {
                                canvas.width = img.width;
                                canvas.height = img.height;
                                canvas.getContext('2d').drawImage(img, 0, 0);
                            };
                            if (typeof data.then === 'function') {
                                data.then(url => img.src = url).catch(e => showToast('خطأ توليد الصورة: ' + e.message, 'error'));
                            } else {
                                img.src = data;
                            }
                        } else {
                            showToast('المكتبة متاحة لكن الواجهة غير معروفة', 'error');
                        }
                    } catch (e) {
                        console.error('Render error:', e);
                        showToast('خطأ أثناء إنشاء الرمز', 'error');
                    }
                }).catch(err => {
                    // already handled by ensureQRCodeLoaded; show message on canvas
                    if (canvas && canvas.getContext) {
                        const ctx = canvas.getContext('2d');
                        canvas.width = 300; canvas.height = 80;
                        ctx.fillStyle = '#111';
                        ctx.fillRect(0,0,canvas.width,canvas.height);
                        ctx.fillStyle = '#f55';
                        ctx.font = '14px sans-serif';
                        ctx.fillText('تعذر تحميل مكتبة QR. استخدم زر إعادة المحاولة.',10,40);
                    }
                });
                return;
            }

            // if lib ready, render immediately
            try {
                const opts = { width: 200, margin: 2, color: { dark: '#000', light: '#fff' }, errorCorrectionLevel: 'M' };
                if (readyLib && typeof readyLib.toCanvas === 'function') {
                    readyLib.toCanvas(canvas, rawData, opts, (err) => {
                        if (err) showToast('خطأ أثناء إنشاء الرمز: ' + (err.message || err), 'error');
                    });
                } else if (readyLib && typeof readyLib.toDataURL === 'function') {
                    const data = readyLib.toDataURL(rawData, opts);
                    const img = new Image();
                    img.onload = () => {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0);
                    };
                    if (typeof data.then === 'function') {
                        data.then(url => img.src = url).catch(e => showToast('خطأ توليد الصورة: ' + e.message, 'error'));
                    } else {
                        img.src = data;
                    }
                } else {
                    showToast('واجهة المكتبة غير معتمدة', 'error');
                }
            } catch (e) {
                console.error('QR Rendering Error:', e);
                showToast('تعذر إنشاء الرمز', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';

            let icon = '<i class="fa-solid fa-circle-info text-[#808000]"></i>';
            if (type === 'success') icon = '<i class="fa-solid fa-circle-check text-[#808000]"></i>';
            if (type === 'error') icon = '<i class="fa-solid fa-triangle-exclamation text-[#990000]"></i>';

            // Use safe insertion of message
            const span = document.createElement('span');
            span.textContent = message;

            toast.innerHTML = icon;
            toast.appendChild(span);
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
