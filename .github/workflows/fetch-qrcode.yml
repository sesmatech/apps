name: Add qrcode.min.js from npm and copy to libs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install qrcode package
        run: |
          npm init -y
          npm install qrcode@1.5.3 --no-audit --no-fund

      - name: Find and copy minified qrcode file
        run: |
          mkdir -p libs
          # try common locations, otherwise search for any .min.js inside the package
          if [ -f node_modules/qrcode/build/qrcode.min.js ]; then
            cp node_modules/qrcode/build/qrcode.min.js libs/qrcode.min.js
          elif [ -f node_modules/qrcode/build/qrcode.umd.min.js ]; then
            cp node_modules/qrcode/build/qrcode.umd.min.js libs/qrcode.min.js
          elif [ -f node_modules/qrcode/dist/qrcode.min.js ]; then
            cp node_modules/qrcode/dist/qrcode.min.js libs/qrcode.min.js
          else
            FILE=$(find node_modules/qrcode -type f -name '*.min.js' | head -n 1 || true)
            if [ -n "$FILE" ]; then
              cp "$FILE" libs/qrcode.min.js
            else
              echo "ERROR: Couldn't find any *.min.js inside node_modules/qrcode" >&2
              ls -la node_modules/qrcode || true
              exit 2
            fi
          fi
          echo "Copied $(stat -c '%n %s' libs/qrcode.min.js || true)"

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add libs/qrcode.min.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add qrcode.min.js (fetched via npm and copied to libs)"
          git push origin HEAD:${{ github.ref_name }}
