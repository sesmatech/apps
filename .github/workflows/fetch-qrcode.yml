name: Add qrcode.min.js (npm -> minify -> libs)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install qrcode package
        run: |
          npm init -y
          npm install qrcode@1.5.3 --no-audit --no-fund

      - name: Find candidate JS and produce libs/qrcode.min.js
        run: |
          set -e
          mkdir -p libs
          # try known prebuilt spots first
          CAND=""
          if [ -f node_modules/qrcode/build/qrcode.min.js ]; then
            CAND=node_modules/qrcode/build/qrcode.min.js
          elif [ -f node_modules/qrcode/build/qrcode.umd.min.js ]; then
            CAND=node_modules/qrcode/build/qrcode.umd.min.js
          elif [ -f node_modules/qrcode/dist/qrcode.min.js ]; then
            CAND=node_modules/qrcode/dist/qrcode.min.js
          elif [ -f node_modules/qrcode/browser/qrcode.js ]; then
            CAND=node_modules/qrcode/browser/qrcode.js
          elif [ -f node_modules/qrcode/browser.js ]; then
            CAND=node_modules/qrcode/browser.js
          elif [ -f node_modules/qrcode/lib/browser.js ]; then
            CAND=node_modules/qrcode/lib/browser.js
          fi

          # if still empty, search for any reasonable .js file inside package
          if [ -z "$CAND" ]; then
            CAND=$(find node_modules/qrcode -type f -name '*.js' | egrep -i 'build|dist|browser|umd|index' | head -n 1 || true)
          fi

          # final fallback - pick the first .js file
          if [ -z "$CAND" ]; then
            CAND=$(find node_modules/qrcode -type f -name '*.js' | head -n 1 || true)
          fi

          if [ -z "$CAND" ]; then
            echo "ERROR: Couldn't find any .js file inside node_modules/qrcode" >&2
            ls -la node_modules/qrcode || true
            exit 2
          fi

          echo "Selected candidate: $CAND"
          # try to minify with terser (install on the fly with npx)
          if npx --yes terser --version >/dev/null 2>&1; then
            echo "Minifying with terser..."
            npx --yes terser "$CAND" -c -m -o libs/qrcode.min.js || true
          fi

          # if minified file empty or not created, copy original as fallback
          if [ ! -s libs/qrcode.min.js ]; then
            echo "Minify failed or no output, copying original as libs/qrcode.min.js"
            cp "$CAND" libs/qrcode.min.js
          fi

          echo "Resulting file:"
          ls -lh libs/qrcode.min.js || true

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add libs/qrcode.min.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add qrcode.min.js (fetched via npm and minified/copy to libs)"
          git push origin HEAD:${{ github.ref_name }}
