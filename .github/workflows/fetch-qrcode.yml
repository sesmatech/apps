name: Add qrcode.min.js from CDN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch qrcode.min.js from jsDelivr
        run: |
          mkdir -p libs
          URL="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"
          echo "Downloading $URL"
          curl -sS -L "$URL" -o libs/qrcode.min.js
          if [ ! -s libs/qrcode.min.js ]; then
            echo "Failed to download qrcode.min.js" >&2
            exit 2
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/qrcode.min.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add qrcode.min.js (fetched from jsDelivr)"
          git push origin HEAD:${{ github.ref_name }}
