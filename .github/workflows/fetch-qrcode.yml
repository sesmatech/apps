name: Build browser-ready qrcode and add to libs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install qrcode package
        run: |
          npm init -y
          npm install qrcode@1.5.3 --no-audit --no-fund

      - name: Find candidate entry file
        id: find
        run: |
          # Try typical entry points inside the package
          CAND=""
          if [ -f node_modules/qrcode/lib/index.js ]; then CAND=node_modules/qrcode/lib/index.js; fi
          if [ -z "$CAND" ] && [ -f node_modules/qrcode/index.js ]; then CAND=node_modules/qrcode/index.js; fi
          if [ -z "$CAND" ]; then
            # fallback: find a reasonable .js file
            CAND=$(find node_modules/qrcode -type f -name '*.js' | egrep -i 'lib|index|browser' | head -n 1 || true)
          fi
          if [ -z "$CAND" ]; then
            echo "ERROR: couldn't find JS entry in node_modules/qrcode" >&2
            exit 2
          fi
          echo "candidate=$CAND" >> $GITHUB_OUTPUT

      - name: Bundle to browser (browserify)
        run: |
          mkdir -p libs
          echo "Using candidate: ${{ steps.find.outputs.candidate }}"
          # Use browserify to create a UMD/global bundle named 'qrcode'
          npx --yes browserify "${{ steps.find.outputs.candidate }}" -s qrcode -o libs/qrcode.js

      - name: Minify (terser) to libs/qrcode.min.js
        run: |
          # If browserify failed or produced no output, try copy fallback
          if [ ! -s libs/qrcode.js ]; then
            echo "browserify did not produce libs/qrcode.js, attempting to copy candidate directly"
            cp "${{ steps.find.outputs.candidate }}" libs/qrcode.js || true
          fi
          # Try minify; if terser missing, npx will fetch it
          npx --yes terser libs/qrcode.js -c -m -o libs/qrcode.min.js || cp libs/qrcode.js libs/qrcode.min.js

      - name: Show resulting file info
        run: |
          echo "Result:"
          ls -lh libs || true
          head -c 200 libs/qrcode.min.js || true

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add libs/qrcode.min.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add browser-ready qrcode (bundled & minified)"
          git push origin HEAD:${{ github.ref_name }}
